<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in</title>
</head>
<body>
<main>
    <h1>Sign in</h1>

    <form>
        <div>
            <label for="email">Email</label>
            <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
            />
        </div>

        <button type="submit">Sign in</button>
    </form>
</main>
</body>
</html>
